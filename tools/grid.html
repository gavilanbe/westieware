<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#222;display:grid;grid-template-columns:repeat(var(--cols),264px);gap:4px;padding:4px}
figure{margin:0;position:relative}
iframe{border:0;display:block;width:264px;height:420px;background:#000}
figcaption{position:absolute;left:4px;bottom:3px;font:10px monospace;color:#fff;background:#0008;padding:1px 3px}
</style></head><body>
<script>
// tools/grid.html?page=../index.html&cols=5&cells=escena=mg%26id=foto|escena=… — many captures, one Chrome (tools/sheet.sh)
const P = new URLSearchParams(location.search), page = P.get('page') || '../index.html';
document.body.style.setProperty('--cols', P.get('cols') || 5);
for (const q of (P.get('cells') || '').split('|').filter(Boolean)) {
  const fig = document.createElement('figure'), f = document.createElement('iframe'), cap = document.createElement('figcaption');
  f.src = page + '?nosave=1&seed=7&' + q; cap.textContent = (q.match(/id=([^&]+)/) || [, q])[1] + (q.includes('escena=stage') ? ' ' + (q.match(/ff=([^&]+)/) || [, ''])[1] : '');
  fig.append(f, cap); document.body.appendChild(fig);
}
</script></body></html>
