<body><script>window.onerror=function(m,s,l,c){document.documentElement.setAttribute('data-err',m+' @'+l+':'+c);};</script><canvas id="c" aria-label="WESTIE WARE ¡Tocados!: microjuegos táctiles en la peluquería canina Westie BLVRD"></canvas>
<script>
// ============================================================================
//  WESTIE WARE ¡Tocados! — core
//  Two DS-style screens (256x192 each). Every scene draws the top screen and
//  the touch screen separately (or one tall picture that spans both, hinge
//  included). Input only lives on the bottom screen, like a real stylus.
// ============================================================================
'use strict';

const SW = 256, SH = 192;            // one screen
const FR = 4;                        // console frame at the sides of the screens
const HINGE = 18;                    // gap between the screens
const TALL_H = SH * 2 + HINGE;       // a tall picture covers both screens + hinge
const STEP = 1 / 60;

const QS = new URLSearchParams(location.search);
const TESTING = QS.has('test');
const SCENE_ARG = QS.get('escena');

// ---------------------------------------------------------------- math ----
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const sgn = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const fl = Math.floor, rd = Math.round;

const E = {
  lin: t => t,
  inQ: t => t * t,
  outQ: t => 1 - (1 - t) * (1 - t),
  ioQ: t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2,
  inC: t => t * t * t,
  outC: t => 1 - (1 - t) ** 3,
  ioC: t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2,
  outQuint: t => 1 - (1 - t) ** 5,
  inBack: t => 2.70158 * t * t * t - 1.70158 * t * t,
  outBack: t => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2,
  outBack2: t => 1 + 4 * (t - 1) ** 3 + 3 * (t - 1) ** 2,
  outElastic: t => t === 0 || t === 1 ? t : 2 ** (-10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
  outBounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; },
  ioSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
// damped spring 0 → 1 with overshoot ("boing"); freq = wobbles per second, damp = decay
const spring = (t, freq = 2.2, damp = 7) => t <= 0 ? 0 : 1 - Math.exp(-damp * t) * Math.cos(freq * TAU * t);

// ---------------------------------------------------------------- rng -----
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RNG = mulberry32(QS.has('seed') ? +QS.get('seed') : (Date.now() & 0xffffff));
const rnd = (a = 1, b) => b === undefined ? RNG() * a : a + RNG() * (b - a);
const rndi = (a, b) => fl(rnd(a, b + 1));
const pick = arr => arr[fl(RNG() * arr.length)];
const chance = p => RNG() < p;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = fl(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// cheap deterministic hash noise (for textures that must not shimmer)
const hash2 = (x, y, s = 0) => { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function vnoise(x, y, s = 0) {
  const xi = fl(x), yi = fl(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
const fbm = (x, y, s = 0) => (vnoise(x, y, s) * .6 + vnoise(x * 2.1, y * 2.1, s + 7) * .3 + vnoise(x * 4.3, y * 4.3, s + 13) * .1);

// ---------------------------------------------------------------- canvases -
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; c.g = g; return c; }
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const TOPC = mkCanvas(SW, SH), BOTC = mkCanvas(SW, SH), TALLC = mkCanvas(SW, TALL_H);
const T = TOPC.g, B = BOTC.g, TL = TALLC.g;

// ---------------------------------------------------------------- save ----
const SAVE_KEY = 'westieware-save-v1';
function defaultSave() {
  return { v: 1, prologue: false, cleared: {}, best: {}, seen: {}, bestMg: {}, unlockSeen: {}, toys: {}, opts: { sound: 1, layout: 'auto' }, plays: 0 };
}
function loadSave() {
  if (QS.has('nosave') || TESTING) return defaultSave();
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.v === 1) { const d = defaultSave(); return Object.assign(d, s, { opts: Object.assign(d.opts, s.opts || {}) }); } } catch (e) { }
  return defaultSave();
}
let SAVE = loadSave();
function persist() { if (QS.has('nosave') || TESTING) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { } }

// ---------------------------------------------------------------- layout --
// Portrait first: the two screens are stacked at full width and centred; on
// tall phones the leftover height becomes console body (lid above, base below).
const LAY = { W: 0, H: 0, s: 1, top: { x: FR, y: FR }, bot: { x: FR, y: FR + SH + HINGE }, frame: null, lid: 0 };
function relayout() {
  const vw = Math.max(1, innerWidth), vh = Math.max(1, innerHeight);
  const W = SW + FR * 2, minH = SH * 2 + HINGE + FR * 2;
  const H = clamp(rd(W * vh / vw), minH, minH + 150);
  let s = Math.min(vw / W, vh / H); s = s >= 2 ? fl(s) : Math.max(.5, s);
  const extra = H - minH, lid = rd(extra * .56);
  LAY.W = W; LAY.H = H; LAY.s = s; LAY.lid = lid;
  LAY.top = { x: FR, y: FR + lid };
  LAY.bot = { x: FR, y: FR + lid + SH + HINGE };
  cv.width = W; cv.height = H; cx.imageSmoothingEnabled = false;
  cv.style.width = fl(W * s) + 'px'; cv.style.height = fl(H * s) + 'px';
  LAY.frame = typeof buildFrame === 'function' ? buildFrame(W, H) : null;
  if (SCENE) render(); // resizing wipes the canvas
}

// ---------------------------------------------------------------- input ---
// IN.* is what scenes read. Edge flags (tap/rel) last exactly one update step.
const IN = {
  x: 128, y: 96, down: false, tap: false, rel: false, dx: 0, dy: 0, vx: 0, vy: 0, sx: 0, sy: 0, held: 0,
  moved: 0, path: [], topTap: false, anyTap: false, key: null, has: false, id: null,
};
const _q = [];
function toScreen(e) {
  const r = cv.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width * LAY.W, ny = (e.clientY - r.top) / r.height * LAY.H;
  const bx = nx - LAY.bot.x, by = ny - LAY.bot.y, tx = nx - LAY.top.x, ty = ny - LAY.top.y;
  const onBot = bx >= -8 && by >= -8 && bx < SW + 8 && by < SH + 8;
  const onTop = !onBot; // anywhere else on the console counts as "tap to continue"
  return { x: clamp(bx, 0, SW - 1), y: clamp(by, 0, SH - 1), onBot, onTop, tx, ty };
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); auUnlock(); const p = toScreen(e); try { cv.setPointerCapture(e.pointerId); } catch (_) { } _q.push({ k: 'd', p, id: e.pointerId }); });
cv.addEventListener('pointermove', e => { const p = toScreen(e); _q.push({ k: 'm', p, id: e.pointerId }); });
const _up = e => { const p = toScreen(e); _q.push({ k: 'u', p, id: e.pointerId }); };
cv.addEventListener('pointerup', _up); cv.addEventListener('pointercancel', _up);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { auUnlock(); if (e.repeat) return; _q.push({ k: 'key', key: e.key }); if ([' ', 'Enter', 'Escape', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault(); });
let _touchOnTop = false;
let REALTAP = false; // a genuine press this step (the demo bot can't fake it)
function pollInput() {
  IN.tap = false; IN.rel = false; IN.topTap = false; IN.anyTap = false; IN.key = null; REALTAP = false;
  const px = IN.x, py = IN.y;
  let dx = 0, dy = 0;
  while (_q.length) {
    const ev = _q.shift();
    if (ev.k === 'key') { IN.key = ev.key; REALTAP = true; if (ev.key === ' ' || ev.key === 'Enter') IN.anyTap = true; continue; }
    const p = ev.p;
    if (ev.k === 'd') {
      REALTAP = true;
      if (IN.down) continue;
      IN.id = ev.id;
      if (p.onBot) {
        IN.down = true; IN.tap = true; IN.anyTap = true; IN.has = true; _touchOnTop = false;
        IN.x = p.x; IN.y = p.y; IN.sx = p.x; IN.sy = p.y; IN.held = 0; IN.moved = 0; IN.path = [{ x: p.x, y: p.y }];
        touchRipple(p.x, p.y);
        if (typeof sfx === 'function') sfx('touch');
      } else if (p.onTop) { IN.topTap = true; IN.anyTap = true; IN.tx = p.tx; IN.ty = p.ty; _touchOnTop = true; }
      break; // one press per step so taps are never merged
    } else if (ev.k === 'm') {
      if (ev.id !== IN.id && IN.down) continue;
      if (IN.down) { dx += p.x - IN.x; dy += p.y - IN.y; IN.moved += Math.hypot(p.x - IN.x, p.y - IN.y); IN.x = p.x; IN.y = p.y; const lp = IN.path[IN.path.length - 1]; if (!lp || Math.hypot(lp.x - p.x, lp.y - p.y) >= 1) IN.path.push({ x: p.x, y: p.y }); if (IN.path.length > 600) IN.path.shift(); }
      else if (p.onBot) { IN.x = p.x; IN.y = p.y; }
    } else if (ev.k === 'u') {
      if (IN.down && (ev.id === IN.id || ev.id == null)) { IN.down = false; IN.rel = true; IN.x = p.x; IN.y = p.y; break; }
      _touchOnTop = false;
    }
  }
  IN.dx = dx; IN.dy = dy;
  IN.vx = lerp(IN.vx, dx / STEP, .5); IN.vy = lerp(IN.vy, dy / STEP, .5);
  if (!IN.down) { IN.vx *= .8; IN.vy *= .8; }
  if (IN.down) IN.held += STEP;
  void px; void py;
}
// the bot (tests + attract mode) drives input through this
const BOTIN = { on: false, x: 0, y: 0, down: false };
function botInput() {
  if (!BOTIN.on) return;
  IN.tap = false; IN.rel = false; IN.anyTap = false; IN.topTap = false;
  const nx = clamp(BOTIN.x, 0, SW - 1), ny = clamp(BOTIN.y, 0, SH - 1);
  IN.dx = BOTIN.down && IN.down ? nx - IN.x : 0; IN.dy = BOTIN.down && IN.down ? ny - IN.y : 0;
  if (BOTIN.down && !IN.down) { IN.down = true; IN.tap = true; IN.anyTap = true; IN.sx = nx; IN.sy = ny; IN.held = 0; IN.moved = 0; IN.path = [{ x: nx, y: ny }]; }
  else if (!BOTIN.down && IN.down) { IN.down = false; IN.rel = true; }
  if (IN.down) { IN.moved += Math.hypot(IN.dx, IN.dy); if (IN.dx || IN.dy) IN.path.push({ x: nx, y: ny }); IN.held += STEP; }
  IN.x = nx; IN.y = ny; IN.vx = IN.dx / STEP; IN.vy = IN.dy / STEP;
}

// touch ripples: every press on the touch screen leaves a small stylus ring
const RIPPLES = [];
function touchRipple(x, y) { RIPPLES.push({ x, y, t: 0 }); }
function drawRipples(g) {
  for (let i = RIPPLES.length - 1; i >= 0; i--) {
    const r = RIPPLES[i]; r.t += STEP;
    if (r.t > .3) { RIPPLES.splice(i, 1); continue; }
    const k = r.t / .3, rad = 3 + k * 9;
    g.globalAlpha = 1 - k; ringPx(g, r.x, r.y, rad, '#ffffff'); g.globalAlpha = (1 - k) * .6; ringPx(g, r.x, r.y, rad + 1, '#1d1424'); g.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------- time ----
let NOW = 0;             // game clock (seconds)
let FRAME = 0;
let HITSTOP = 0;         // frames of freeze for impacts
let SLOWMO = 1;
const TIMERS = [];
function after(sec, fn) { TIMERS.push({ at: NOW + sec, fn }); }
function runTimers() { for (let i = TIMERS.length - 1; i >= 0; i--) if (NOW >= TIMERS[i].at) { const t = TIMERS.splice(i, 1)[0]; t.fn(); } }

// tweens: tween(obj, {x: 10}, 0.3, E.outBack, delay)
const TWEENS = [];
function tween(o, to, dur, ease = E.outQ, delay = 0, done) {
  const tw = { o, to, from: null, dur: Math.max(1e-4, dur), ease, t: -delay, done };
  TWEENS.push(tw); return tw;
}
function runTweens(dt) {
  for (let i = TWEENS.length - 1; i >= 0; i--) {
    const tw = TWEENS[i]; tw.t += dt; if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.o[k]; }
    const k = Math.min(1, tw.t / tw.dur), e = tw.ease(k);
    for (const p in tw.to) tw.o[p] = tw.from[p] + (tw.to[p] - tw.from[p]) * e;
    if (k >= 1) { TWEENS.splice(i, 1); tw.done && tw.done(); }
  }
}

// ---------------------------------------------------------------- shake ---
const SHAKE = { top: { a: 0, t: 0 }, bot: { a: 0, t: 0 } };
function shake(which, amp, dur = .25) { for (const w of which === 'both' ? ['top', 'bot'] : [which]) { const s = SHAKE[w]; if (amp >= s.a * (s.t > 0 ? 1 : 0)) { s.a = amp; s.t = dur; s.d = dur; } } }
function shakeOff(w) { const s = SHAKE[w]; if (s.t <= 0) return [0, 0]; const k = s.t / s.d, a = s.a * k; return [rd((RNG() * 2 - 1) * a), rd((RNG() * 2 - 1) * a)]; }
// full-screen colour flashes (per screen)
const FLASH = { top: null, bot: null };
function flash(which, col = '#ffffff', dur = .12, a = 1) { for (const w of which === 'both' ? ['top', 'bot'] : [which]) FLASH[w] = { col, dur, t: dur, a }; }

// ---------------------------------------------------------------- scenes --
let SCENE = null, NEXT = null;
function go(scene, arg) {
  if (SCENE && SCENE.exit) SCENE.exit();
  SCENE = scene; SCENE._t = 0;
  if (scene.enter) scene.enter(arg);
}
// A transition covers both screens, swaps scene at its midpoint.
let TRANS = null;
function transit(kind, scene, arg, dur = .7, col) {
  if (TRANS) return;
  TRANS = { kind, scene, arg, dur, t: 0, swapped: false, col: col || '#1d1424' };
}
function runTransition(dt) {
  if (!TRANS) return;
  TRANS.t += dt;
  if (!TRANS.swapped && TRANS.t >= TRANS.dur / 2) { TRANS.swapped = true; if (TRANS.scene) go(TRANS.scene, TRANS.arg); }
  if (TRANS.t >= TRANS.dur) TRANS = null;
}

// ---------------------------------------------------------------- loop ----
let _last = 0, _acc = 0, PAUSED = false, FROZEN = QS.has('freeze');
function tick(dt) {
  FRAME++;
  pollInput();
  if (BOTIN.on && typeof botDrive === 'function') botDrive();
  botInput();
  if (SCENE && SCENE.always) SCENE.always(dt); // clocks that must not stop during hit-stop (the beat!)
  if (HITSTOP > 0) { HITSTOP--; return; }
  const sdt = dt * SLOWMO;
  NOW += sdt;
  runTimers();
  runTweens(sdt);
  for (const w of ['top', 'bot']) { const s = SHAKE[w]; if (s.t > 0) s.t -= dt; const f = FLASH[w]; if (f) { f.t -= dt; if (f.t <= 0) FLASH[w] = null; } }
  if (SCENE) { SCENE._t += sdt; SCENE.update && SCENE.update(sdt); }
  runTransition(dt);
  if (typeof auTick === 'function') auTick();
}
function render() {
  const sc = SCENE;
  if (sc) {
    if (sc.drawTall) {
      TL.save(); sc.drawTall(TL); TL.restore();
      T.drawImage(TALLC, 0, 0, SW, SH, 0, 0, SW, SH);
      B.drawImage(TALLC, 0, SH + HINGE, SW, SH, 0, 0, SW, SH);
      if (sc.drawTopOver) { T.save(); sc.drawTopOver(T); T.restore(); }
      if (sc.drawBotOver) { B.save(); sc.drawBotOver(B); B.restore(); }
    } else {
      T.save(); sc.drawTop && sc.drawTop(T); T.restore();
      B.save(); sc.drawBot && sc.drawBot(B); B.restore();
    }
  }
  if (TRANS && typeof drawTransition === 'function') drawTransition(TRANS);
  drawRipples(B);
  for (const w of ['top', 'bot']) { const f = FLASH[w]; if (f) { const g = w === 'top' ? T : B; g.globalAlpha = f.a * clamp(f.t / f.dur, 0, 1); g.fillStyle = f.col; g.fillRect(0, 0, SW, SH); g.globalAlpha = 1; } }
  // composite
  cx.fillStyle = '#0c0a10'; cx.fillRect(0, 0, LAY.W, LAY.H);
  if (LAY.frame) cx.drawImage(LAY.frame, 0, 0);
  const [tx, ty] = shakeOff('top'), [bx, by] = shakeOff('bot');
  cx.save(); cx.beginPath(); cx.rect(LAY.top.x, LAY.top.y, SW, SH); cx.clip(); cx.fillStyle = '#000'; cx.fillRect(LAY.top.x, LAY.top.y, SW, SH); cx.drawImage(TOPC, LAY.top.x + tx, LAY.top.y + ty); cx.restore();
  cx.save(); cx.beginPath(); cx.rect(LAY.bot.x, LAY.bot.y, SW, SH); cx.clip(); cx.fillStyle = '#000'; cx.fillRect(LAY.bot.x, LAY.bot.y, SW, SH); cx.drawImage(BOTC, LAY.bot.x + bx, LAY.bot.y + by); cx.restore();
  if (typeof drawFrameOver === 'function') drawFrameOver(cx);
  if (LANDSCAPE_HINT.on && typeof drawRotateHint === 'function') drawRotateHint(cx);
}
// phones held sideways get a friendly "play it upright" card (tap to dismiss)
const LANDSCAPE_HINT = { on: false, dismissed: false };
function checkOrientation() {
  const coarse = matchMedia && matchMedia('(pointer: coarse)').matches;
  LANDSCAPE_HINT.on = coarse && innerWidth > innerHeight * 1.15 && !LANDSCAPE_HINT.dismissed;
}
addEventListener('resize', checkOrientation);
addEventListener('pointerdown', () => { if (LANDSCAPE_HINT.on) { LANDSCAPE_HINT.dismissed = true; LANDSCAPE_HINT.on = false; } });
document.addEventListener('gesturestart', e => e.preventDefault());
function frame(now) {
  requestAnimationFrame(frame);
  if (!_last) _last = now;
  let dt = (now - _last) / 1000; _last = now;
  if (dt > .25) dt = .25;
  if (PAUSED || FROZEN) { render(); return; }
  _acc += dt;
  let n = 0;
  try {
    while (_acc >= STEP && n < 8) { _acc -= STEP; tick(STEP); n++; }
    if (n === 8) _acc = 0;
    render();
  } catch (e) { reportError(e); }
  if (typeof warmStep === 'function' && WARM.length) warmStep(n > 1 ? 4 : 9);
}
// errors never freeze the console: they are noted (visible in ?debug) and the game carries on
const ERRORS = [];
function reportError(e) { if (ERRORS.length < 20) ERRORS.push(String(e && e.stack || e)); document.documentElement.setAttribute('data-err', String(e && e.message || e)); if (QS.has('debug')) console.error(e); }
addEventListener('resize', relayout);
document.addEventListener('visibilitychange', () => { if (typeof auSuspend === 'function') auSuspend(document.hidden); });
// ============================================================================
//  gfx — pixel toolkit made for this game.
//  · named palette + material ramps (dark → light, hue-shifted)
//  · aliased primitives (discs, rings, thick lines, polygons, dithers)
//  · string sprites
//  · MODEL: a part rasteriser. Every part is a signed-distance shape with a
//    material ramp; pixels are lit from the top-left, quantised to the ramp
//    with a light ordered dither, then get contact shadows, part-edge lines and
//    a selective outline (coloured on the lit side, ink on the shadow side).
// ============================================================================
'use strict';

const INK = '#1d1424';
const RAMP = {
  fur: ['#56557a', '#8587ab', '#b3b8d4', '#dfe3f1', '#ffffff'],          // westie white
  cream: ['#8a6a44', '#b9955f', '#dcc08a', '#f2e2b8', '#fff8e6'],
  apricot: ['#6e3520', '#a45a31', '#d4874c', '#f0b573', '#ffdfa8'],
  caramel: ['#4e2616', '#7c3f1f', '#ab6130', '#d58c4c', '#f2b978'],

// A particle layer; each microgame / scene owns one so zooms carry it along.
class FX {
  constructor() { this.p = []; }
  add(o) { const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, life: .6, t: 0, k: 'spark', c: '#fff', r: 2, rot: 0, vr: 0 }, o); this.p.push(p); return p; }
  burst(x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = (o.a0 != null ? o.a0 : 0) + (o.spread != null ? o.spread : TAU) * (i + rnd(.8)) / n, sp = rnd(o.sp0 != null ? o.sp0 : 30, o.sp1 != null ? o.sp1 : 90);
      this.add(Object.assign({}, o, { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(o.life0 || .35, o.life1 || .7), c: Array.isArray(o.c) ? pick(o.c) : o.c, r: o.r != null ? o.r : rnd(1, 2.5), rot: rnd(TAU), vr: rnd(-12, 12) }));
    }
  }
  update(dt) {
    for (let i = this.p.length - 1; i >= 0; i--) {
      const p = this.p[i]; p.t += dt;
      if (p.t >= p.life) { this.p.splice(i, 1); continue; }
      p.vy += p.g * dt; if (p.drag) { const d = Math.exp(-p.drag * dt); p.vx *= d; p.vy *= d; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.floor != null && p.y > p.floor) { p.y = p.floor; p.vy *= -.35; p.vx *= .6; }
    }
  }
  draw(g) {
    for (const p of this.p) {
      const k = p.t / p.life, x = p.x, y = p.y;
      switch (p.k) {
        case 'spark': { const r = p.r * (1 - k); if (r < .5) { px(g, x, y, p.c); break; } g.fillStyle = p.c; const R = Math.max(1, rd(r * 1.6)); g.fillRect(rd(x) - R, rd(y), R * 2 + 1, 1); g.fillRect(rd(x), rd(y) - R, 1, R * 2 + 1); if (R > 1) g.fillRect(rd(x) - 1, rd(y) - 1, 3, 3); break; }
        case 'dot': disc(g, x, y, p.r * (1 - k * .7), p.c); break;
        case 'star': drawStar(g, x, y, p.r * (1 - k * .5) + 1, p.c, p.rot); break;
        case 'ring': { g.globalAlpha = 1 - k; ringPx(g, x, y, p.r + k * (p.grow || 14), p.c); g.globalAlpha = 1; break; }
        case 'bubble': { const r = p.r * (1 + k * .2); ringPx(g, x, y, r, p.c); px(g, x - r * .4, y - r * .4, '#ffffff'); break; }
        case 'drop': { const len = clamp(Math.hypot(p.vx, p.vy) * .03, 1, 4); g.fillStyle = p.c; const ang = Math.atan2(p.vy, p.vx); for (let q = 0; q < len; q++) g.fillRect(rd(x - Math.cos(ang) * q), rd(y - Math.sin(ang) * q), q === 0 ? 2 : 1, q === 0 ? 2 : 1); break; }
        case 'hair': { g.fillStyle = p.c; const L = p.r * 2 + 2; for (let q = 0; q < L; q++) g.fillRect(rd(x + Math.cos(p.rot) * q + Math.sin(q * .9) * .6), rd(y + Math.sin(p.rot) * q), 1, 1); break; }
        case 'conf': { g.fillStyle = p.c; const w2 = Math.max(1, rd(Math.abs(Math.cos(p.rot)) * 3)); g.fillRect(rd(x), rd(y), w2, 2); break; }
        case 'puff': { const r = p.r * (.6 + k * .9); g.globalAlpha = 1 - k * k; disc(g, x, y, r, p.c); g.globalAlpha = 1; break; }
        case 'txt': { const a = k < .7 ? 1 : 1 - (k - .7) / .3; g.globalAlpha = a; txt(g, p.s, x, y - k * 6, p.c, { align: 'c', out: p.out || INK }); g.globalAlpha = 1; break; }

    }
  }

}

// soft ground shadow ellipse (dithered)
function shadowOval(g, x, y, rx, ry, k = .55) {
  g.fillStyle = INK;

    const t = j / (ry + .01); if (Math.abs(t) > 1) continue;

// eyes shared by the dogs: (x, y) is the top-left of a 5x5 eye
function dogEye(g, x, y, kind, K = RAMP.black) {
  switch (kind) {
    case 'happy': hline(g, x, x + 4, y + 2, K[0]); px(g, x - 1, y + 3, K[0]); px(g, x + 5, y + 3, K[0]); hline(g, x + 1, x + 3, y + 1, K[0]); return;
    case 'closed': hline(g, x, x + 4, y + 3, K[0]); px(g, x - 1, y + 2, K[0]); px(g, x + 5, y + 2, K[0]); return;
    case 'sad': rect(g, x, y + 2, 5, 3, K[0]); px(g, x + 1, y + 2, '#fff'); hline(g, x - 1, x + 2, y + (x < 32 ? 0 : 1), K[1]); hline(g, x + 3, x + 5, y + (x < 32 ? 1 : 0), K[1]); return;
    case 'wow': rect(g, x, y - 1, 5, 6, K[0]); rect(g, x + 1, y, 3, 4, K[1]); px(g, x + 1, y, '#fff'); px(g, x + 2, y, '#fff'); px(g, x + 3, y + 3, '#fff'); return;
    case 'spiral': rect(g, x, y, 5, 5, '#fff'); ringPx(g, x + 2.5, y + 2.5, 2.2, K[0]); px(g, x + 2, y + 2, K[0]); return;
    case 'x': linePx(g, x, y, x + 4, y + 4, K[0]); linePx(g, x + 4, y, x, y + 4, K[0]); return;
    case 'grr': rect(g, x, y + 2, 5, 3, K[0]); px(g, x + 1, y + 2, '#fff'); return;
    case 'heart': drawHeart(g, x + 2.5, y + 2, RAMP.pink[2], .9); px(g, x + 1, y + 1, '#fff'); return;
    case 'star': drawStar(g, x + 2.5, y + 2.5, 3.4, RAMP.yellow[3]); return;
    default: // round shiny eye
      rect(g, x + 1, y, 3, 5, K[0]); rect(g, x, y + 1, 5, 3, K[0]);
      rect(g, x + 1, y + 1, 3, 3, K[1]); px(g, x + 1, y + 1, '#ffffff'); px(g, x + 2, y + 1, '#ffffff'); px(g, x + 1, y + 2, '#ffffff'); px(g, x + 3, y + 3, K[3]);

}

// expressions painted over the base: normal, happy, wow, sad, wink, grr, dizzy, love
function buleHead(ex = 'normal', F = RAMP.fur) {
  return mdl('buleHead:' + ex + F[0], () => {
    const base = buleHeadBase(F), c = mkCanvas(base.width, base.height), g = c.g;
    g.drawImage(base, 0, 0);
    const K = RAMP.black;
    // a soft shadow under the brow fur
    for (const bx of [21, 38]) { px(g, bx, 26, F[2]); hline(g, bx + 1, bx + 3, 25, F[2]); px(g, bx + 4, 26, F[2]); }
    const eyes = { normal: ['', ''], happy: ['happy', 'happy'], wow: ['wow', 'wow'], sad: ['sad', 'sad'], wink: ['', 'closed'], grr: ['grr', 'grr'], dizzy: ['spiral', 'spiral'], love: ['heart', 'heart'], ko: ['x', 'x'] }[ex] || ['', ''];

// the face: brows, lined eyes, blush, red lips — drawn by hand for each mood
function anahiFace(g, cx0, ex) {
  const K = '#1b1016', SK = RAMP.skin, L = RAMP.red, HR = RAMP.hair;
  // hair: centre parting + shine
  vline(g, cx0, 8, 11, HR[3]); px(g, cx0 - 4, 9, HR[4]); px(g, cx0 - 5, 10, HR[4]); px(g, cx0 + 5, 10, HR[3]);
  const ey = 20, lx = cx0 - 6, rx = cx0 + 3;
  const brow = (x, dy, flip) => { const pts = flip ? [[x, 16 + dy], [x + 1, 15 + dy], [x + 2, 15 + dy], [x + 3, 16 + dy]] : [[x, 16 + dy], [x + 1, 15 + dy], [x + 2, 15 + dy], [x + 3, 16 + dy]]; for (const [a, b] of pts) px(g, a, b, K); };

    rect(g, x, ey - 1, 4, 1, K); px(g, x + (x < cx0 ? -1 : 4), ey - 2, K); // lid line + liner flick
    rect(g, x, ey, 4, 3, '#ffffff'); rect(g, x + 1 + look, ey, 2, 3, '#2b1a1a'); px(g, x + 1 + look, ey, '#ffffff'); px(g, x + 2 + look, ey + 2, '#4a2a22');
    hline(g, x, x + 3, ey + 3, SK[2]);
  };
  const eyeHappy = x => { px(g, x, ey + 1, K); hline(g, x + 1, x + 2, ey, K); px(g, x + 3, ey + 1, K); px(g, x + (x < cx0 ? -1 : 4), ey, K); };
  const eyeClosed = x => { hline(g, x, x + 3, ey + 1, K); px(g, x + (x < cx0 ? -1 : 4), ey, K); };
  const blush = () => { for (const bx of [cx0 - 8, cx0 + 5]) { px(g, bx, 24, RAMP.pink[3]); px(g, bx + 2, 24, RAMP.pink[3]); px(g, bx + 1, 25, RAMP.pink[3]); } };
  const lips = (kind) => {
    const y = 27;
    if (kind === 'o') { rect(g, cx0 - 1, y - 1, 3, 3, L[1]); px(g, cx0, y, '#3e0d1c'); return; }
    if (kind === 'open') { hline(g, cx0 - 2, cx0 + 2, y - 1, L[2]); rect(g, cx0 - 2, y, 5, 2, '#3e0d1c'); hline(g, cx0 - 1, cx0 + 1, y + 1, RAMP.pink[2]); hline(g, cx0 - 2, cx0 + 2, y + 2, L[2]); return; }
    if (kind === 'sad') { hline(g, cx0 - 1, cx0 + 1, y, L[2]); px(g, cx0 - 2, y + 1, L[1]); px(g, cx0 + 2, y + 1, L[1]); return; }
    if (kind === 'flat') { hline(g, cx0 - 2, cx0 + 2, y, L[1]); px(g, cx0, y + 1, L[2]); return; }
    // smile
    px(g, cx0 - 3, y - 1, L[1]); hline(g, cx0 - 2, cx0 + 2, y, L[2]); px(g, cx0 + 3, y - 1, L[1]); hline(g, cx0 - 1, cx0 + 1, y + 1, L[1]); px(g, cx0 - 1, y, L[3]);
  };
  px(g, cx0, 24, SK[2]); px(g, cx0 + 1, 23, SK[1] === undefined ? SK[2] : SK[2]); // nose
  switch (ex) {
    case 'wink': brow(lx, 0); brow(rx, -1, 1); eyeOpen(lx); eyeClosed(rx); blush(); lips('smile'); break;
    case 'joy': brow(lx, -1); brow(rx, -1, 1); eyeHappy(lx); eyeHappy(rx); blush(); lips('open'); break;
    case 'shock': brow(lx, -2); brow(rx, -2, 1); eyeOpen(lx); eyeOpen(rx); lips('o'); rect(g, cx0 + 9, 14, 1, 3, '#9bd6f7'); px(g, cx0 + 9, 17, '#dff4ff'); break;
    case 'focus': brow(lx, 1); brow(rx, 1, 1); eyeOpen(lx, 1); eyeOpen(rx, 1); lips('flat'); break;
    case 'gasp': brow(lx, -2); brow(rx, -2, 1); eyeOpen(lx); eyeOpen(rx); lips('open'); break;
    case 'cry': brow(lx, 0); brow(rx, 0, 1); eyeClosed(lx); eyeClosed(rx); vline(g, lx + 1, ey + 2, ey + 5, '#9bd6f7'); vline(g, rx + 2, ey + 2, ey + 5, '#9bd6f7'); lips('sad'); break;
    case 'talk': brow(lx, 0); brow(rx, 0, 1); eyeOpen(lx); eyeOpen(rx); blush(); lips('open'); break;
    case 'hmm': brow(lx, 1); brow(rx, -1, 1); eyeOpen(lx, 1); eyeOpen(rx, 1); lips('flat'); break;
    default: brow(lx, 0); brow(rx, 0, 1); eyeOpen(lx); eyeOpen(rx); blush(); lips('smile');
  }
}

//  A microgame is a plain object:

    lose() { if (this.state !== 'play') return; this.state = 'lost'; this.decidedAt = this.t; mgOnDecide(this, false); },

}

// ============================================================================
//  cutscene — comic-strip storytelling across both screens.
//  defCut(id, { song, shots: [ { dur, tall(g,t,st) | top(g,t,st) + bot(g,t,st),
//     lines: [[who, text], …], box: 'bot'|'top'|'none', sfx: [[t, name, o]],
//     play: microgameId, enter(st), song } ] })
//  A shot with lines waits for taps; one without lines runs for `dur` seconds.
// ============================================================================
'use strict';

const CUTS = {};
function defCut(id, def) { CUTS[id] = def; }
let _cutDone = null;
function playCut(id, done) { _cutDone = done; go(CUT, { id }); }

const WHO = {
  anahi: { name: 'Anahí', col: '#2a7356', voice: 'anahi' },
  bule: { name: 'Bule', col: '#8587ab', voice: 'bule' },
  guru: { name: 'Gurú', col: '#6b3fb0', voice: 'guru' },
  narr: { name: '', col: '#1d1424', voice: 'narr' },
};

const CUT = {
  enter(arg) {
    const def = CUTS[arg.id];
    this.def = def; this.id = arg.id; this.i = -1; this.st = {}; this.fx = new FX(); this.topFx = new FX(); this._finished = false;
    stopAllMusic(.1);
    if (def.song) this.song = playSong(def.song, { loop: true });
    this.next();
  },
  exit() { stopAllMusic(.15); },
  next() {
    this.i++;
    const sh = this.def.shots[this.i];
    if (!sh) { this.i = this.def.shots.length; this.finish(); return; }
    this.sh = sh; this.t = 0; this.li = 0; this.chars = 0; this.lineT = 0; this.fired = {};
    if (sh.song) { stopAllMusic(.1); playSong(sh.song, { loop: sh.songLoop !== false }); }
    if (sh.enter) sh.enter(this.st, this);
    if (sh.play) { this.mg = mgNew(sh.play, 1, sh.bpm || 116); this.mgT = 0; this.mgTry = 0; this.mgDone = false; sfx('stamp'); }
    else this.mg = null;
  },
  finish() {
    if (this._finished) return; this._finished = true;
    const d = _cutDone; _cutDone = null;
    stopAllMusic(.2);
    if (d) transit('paw', null, null, .7), after(.35, () => { this._finished = false; d(); });
  },
  update(dt) {
    const sh = this.sh; if (!sh || this._finished) return;
    this.t += dt; this.fx.update(dt); this.topFx.update(dt);
    // scheduled sound effects
    if (sh.sfx) sh.sfx.forEach(([at, name, o], k) => { if (!this.fired[k] && this.t >= at) { this.fired[k] = 1; sfx(name, o || {}); } });
    if (sh.update) sh.update(this.st, this.t, dt, this);
    // skip everything (top-right corner of the top screen)
    if (IN.topTap && IN.tx > SW - 60 && IN.ty < 20 && this.t > .2) { sfx('back'); this.i = this.def.shots.length; this.finish(); return; }
    if (this.mg) { this.updateMg(dt); return; }
    const lines = sh.lines || [];
    if (lines.length && this.li < lines.length) {
      const line = lines[this.li][1];
      const startAt = this.li === 0 ? (sh.wait || 0) : 0;
      if (this.t < startAt) return;
      this.lineT += dt;
      const before = this.chars;
      this.chars = Math.min(line.length, this.chars + dt * 42);
      if (fl(this.chars / 2) !== fl(before / 2) && this.chars < line.length && line[fl(this.chars)] !== ' ') voiceBlip((WHO[lines[this.li][0]] || WHO.narr).voice);
      const autoNext = QS.has('auto') && this.chars >= line.length && this.lineT > .9;
      if ((IN.anyTap && this.lineT > .12) || autoNext) {

  updateMg(dt) {

  drawTop(g) {

  },
  drawBot(g) {

  _tall() { if (this._tallFrame === FRAME) return; this._tallFrame = FRAME; TL.save(); TL.clearRect(0, 0, SW, TALL_H); this.sh.tall(TL, this.t, this.st, this); TL.restore(); },
  drawSkip(g) { const a = this.t < 1.5 ? 1 : .55; g.globalAlpha = a; panel(g, SW - 56, 4, 52, 13, '#ffffff', { r: 3 }); txt(g, 'SALTAR ▸', SW - 30, 7, INK, { align: 'c' }); g.globalAlpha = 1; },
  drawBox(g) {

    if (W0.name) { const nw = txtW(W0.name) + 12; panel(g, bx + 8, y0 - 8, nw, 13, W0.col, { r: 4 }); txt(g, W0.name, bx + 14, y0 - 5, '#ffffff'); }

  const St = ['#2a1c44', '#3d2766', '#5a3d8a', '#7a5aa8'], G = RAMP.gold, b = 7;

  ringRect(g, x - b, y - b, w + b * 2, h + b * 2, b - 2, St[1]);
  // stone blocks along the frame
  for (let i = 0; i < w + b * 2; i += 12) { vline(g, x - b + i, y - b, y - 3, St[0]); vline(g, x - b + i + 6, y + h + 2, y + h + b - 1, St[0]); }
  for (let i = 0; i < h + b * 2; i += 10) { hline(g, x - b, x - 3, y - b + i, St[0]); hline(g, x + w + 2, x + w + b - 1, y - b + i + 5, St[0]); }

  ringRect(g, x - 2, y - 2, w + 4, h + 4, 1, G[2]); ringRect(g, x - 1, y - 1, w + 2, h + 2, 1, INK);
  // pointed arch above, keystone with a green gem
  const ax = x + w / 2, ay = y - b - 22, bob = Math.abs(Math.sin(beat * Math.PI)) * 1;
  const arch = []; for (let i = 0; i <= 16; i++) { const k = i / 16, s = k < .5 ? k * 2 : (1 - k) * 2; arch.push([lerp(x - b, x + w + b, k), lerp(y - b, ay, Math.pow(s, .6))]); }
  for (let i = 1; i < arch.length; i++) { thickLine(g, arch[i - 1][0], arch[i - 1][1], arch[i][0], arch[i][1], 3.5, INK); }
  for (let i = 1; i < arch.length; i++) { thickLine(g, arch[i - 1][0], arch[i - 1][1], arch[i][0], arch[i][1], 2.4, St[2]); linePx(g, arch[i - 1][0], arch[i - 1][1] - 1, arch[i][0], arch[i][1] - 1, St[3]); }
  polyPx(g, [[ax - 7, ay - 2 - bob], [ax + 7, ay - 2 - bob], [ax + 5, ay + 10], [ax - 5, ay + 10]], INK);
  polyPx(g, [[ax - 6, ay - 1 - bob], [ax + 6, ay - 1 - bob], [ax + 4, ay + 9], [ax - 4, ay + 9]], St[2]);
  disc(g, ax, ay + 3 - bob * .5, 3, INK); disc(g, ax, ay + 3 - bob * .5, 2.2, '#5bd18b'); px(g, ax - 1, ay + 2 - bob * .5, '#d2f5e4');
  // two candles on the sill corners
  cenizaCandle(g, x - b + 3, y + h + b + 1, NOW, 8); cenizaCandle(g, x + w + b - 3, y + h + b + 1, NOW + .4, 8);
};

const POMPON_POSES = {

function pomponBody(pose = 'idle') {

      { f: footL, ramp: K, z: 1.6, th: 2 }, { f: footR, ramp: K, z: 1.6, th: 2 },

      { f: mane, fs: maneS, ramp: F, z: 3, th: 11, tex: pomponCurlTex(5) },
      { f: armL, ramp: K, z: aZ, th: 2.5 }, { f: armR, ramp: K, z: aZ, th: 2.5 },
      { f: pomponCurlEdge(cuffL, 6, .8), fs: cuffL, ramp: F, z: aZ + .2, th: 3, tex: pomponCurlTex(6, 2.6) }, { f: pomponCurlEdge(cuffR, 7, .8), fs: cuffR, ramp: F, z: aZ + .2, th: 3, tex: pomponCurlTex(7, 2.6) },
      { f: pawL, ramp: K, z: aZ + .3, th: 2, amb: .35 }, { f: pawR, ramp: K, z: aZ + .3, th: 2, amb: .35 },
      { f: pomponCurlEdge(earLS, 8), fs: earLS, ramp: F, z: 4, th: 5, tex: pomponCurlTex(8) }, { f: pomponCurlEdge(earRS, 9), fs: earRS, ramp: F, z: 4, th: 5, tex: pomponCurlTex(9) },

// a pink ribbon bow painted at (x, y), size s
function pomponBowAt(g, x, y, s) {
  const B = POMPON_BOW, w = 7 * s, h = 5 * s;
  polyPx(g, [[x, y], [x - w - 1, y - h - 1], [x - w - 1, y + h + 1]], INK); polyPx(g, [[x, y], [x + w + 1, y - h - 1], [x + w + 1, y + h + 1]], INK);
  polyPx(g, [[x, y], [x - w, y - h], [x - w, y + h]], B[2]); polyPx(g, [[x, y], [x + w, y - h], [x + w, y + h]], B[2]);
  if (s > .7) { polyPx(g, [[x - 1, y], [x - w + 1, y - h + 2], [x - w + 1, y]], B[3]); polyPx(g, [[x + 1, y], [x + w - 1, y - h + 2], [x + w - 1, y]], B[3]); }
  disc(g, x, y, 2.2 * s + .6, INK); disc(g, x, y, 1.6 * s + .4, B[1]); px(g, x - 1, y - 1, B[4]);

// idol face: big glossy eyes with lashes, blush, singing mouth
function pomponFace(g, cx0, ex) {

  const eye = (x, look = 0) => {
    rect(g, x + 1, ey, 3, 6, K); rect(g, x, ey + 1, 5, 4, K);
    rect(g, x + 1, ey + 1, 3, 4, '#5a2350'); rect(g, x + 1, ey + 3, 3, 2, '#9c3f7d');
    px(g, x + 1 + look, ey + 1, '#ffffff'); px(g, x + 2 + look, ey + 1, '#ffffff'); px(g, x + 1 + look, ey + 2, '#ffffff'); px(g, x + 3, ey + 4, '#ffd1e4');
    // lashes on the outer corner
    if (x < cx0) { px(g, x - 1, ey, K); px(g, x - 2, ey - 1, K); px(g, x, ey - 1, K); } else { px(g, x + 5, ey, K); px(g, x + 6, ey - 1, K); px(g, x + 4, ey - 1, K); }
  };
  const shut = (x, up) => { if (up) { px(g, x, ey + 3, K); hline(g, x + 1, x + 3, ey + 2, K); px(g, x + 4, ey + 3, K); } else { hline(g, x, x + 4, ey + 3, K); } if (x < cx0) px(g, x - 1, ey + 2, K); else px(g, x + 5, ey + 2, K); };
  const star = x => { drawStar(g, x + 2.5, ey + 3, 3.6, '#fff27a'); px(g, x + 2, ey + 3, '#ffffff'); };
  const blush = () => { for (const bx of [cx0 - 9, cx0 + 6]) { px(g, bx, 35, L[3]); px(g, bx + 2, 35, L[3]); px(g, bx + 1, 36, L[3]); } };

    const y = 40;
    if (kind === 'sing') { rect(g, cx0 - 1, y - 1, 3, 3, INK); px(g, cx0, y, L[2]); return; }
    if (kind === 'open') { hline(g, cx0 - 2, cx0 + 2, y - 1, INK); rect(g, cx0 - 2, y, 5, 2, '#3e0d1c'); hline(g, cx0 - 1, cx0 + 1, y + 1, L[2]); return; }
    if (kind === 'sad') { hline(g, cx0 - 1, cx0 + 1, y, INK); px(g, cx0 - 2, y + 1, INK); px(g, cx0 + 2, y + 1, INK); return; }

    if (kind === 'grit') { hline(g, cx0 - 3, cx0 + 3, y - 1, INK); hline(g, cx0 - 2, cx0 + 2, y, '#ffffff'); hline(g, cx0 - 3, cx0 + 3, y + 1, INK); return; }

    case 'sing': shut(lx, true); shut(rx, true); blush(); mouth('sing'); break;
    case 'joy': shut(lx, true); shut(rx, true); blush(); mouth('open'); break;

    default: eye(lx); eye(rx); blush(); mouth('smile');

}

// ---------------------------------------------------------------- the hero --
function heroCape(g, x, y, t, dir = 1, len = 48, lift = 0) {
  // a big billowing cape pinned at the neck (x, y), streaming back over the body
  const top = [], bot = [];
  for (let i = 0; i <= 10; i++) {
    const k = i / 10, wave = Math.sin(t * 11 - k * 5.5) * 5 * k, up = lift * k * 12;
    top.push([x - dir * k * len, y - 2 - k * 6 + wave - up]);
    bot.push([x - dir * k * len * .96, y + 7 + k * 20 + wave * 1.3 - up]);
  }
  const poly = top.concat(bot.slice().reverse());
  polyPx(g, poly.map(([a, b]) => [a + dir, b + 1]), INK); polyPx(g, poly.map(([a, b]) => [a - dir, b - 1]), INK);
  polyPx(g, poly, RAMP.green[2]);
  // lining + folds
  for (let i = 1; i < 10; i += 3) linePx(g, top[i][0], top[i][1] + 2, bot[i + 1][0], bot[i + 1][1] - 2, RAMP.green[1]);
  for (let i = 0; i < 10; i++) linePx(g, top[i][0], top[i][1] + 1, top[i + 1][0], top[i + 1][1] + 1, RAMP.green[3]);
  for (let i = 0; i < 10; i++) linePx(g, bot[i][0], bot[i][1], bot[i + 1][0], bot[i + 1][1], RAMP.gold[3]);
  // gold clasp at the neck and the W crest on the cloth
  disc(g, x, y + 2, 3, INK); disc(g, x, y + 2, 2, RAMP.gold[4]);
  const mi = 5, mx = (top[mi][0] + bot[mi][0]) / 2, my = (top[mi][1] + bot[mi][1]) / 2;
  disc(g, mx, my, 6, INK); disc(g, mx, my, 5, RAMP.gold[3]); disc(g, mx - 1, my - 1, 3, RAMP.gold[4]); tiny(g, 'W', mx, my - 2, RAMP.green[1], { align: 'c' });
}
function drawSuperWestie(g, x, y, t, o = {}) {
  // (x, y) = centre of the flying dog
  const dir = o.flip ? -1 : 1, mood = o.mood || 'happy', bob = Math.sin(t * 4) * 2;
  heroCape(g, x + dir * 16, y - 14 + bob, t, dir, 56, o.lift || 0);
  drawS(g, westieSide(1, 'wag', mood), x, y + bob, { flip: o.flip, rot: (o.rot || 0) * dir });
  // domino mask over the eye + gold collar with a star tag
  const ex = x + dir * 28, ey = y - 15 + bob;
  rect(g, ex - 6, ey - 3, 12, 6, INK); rect(g, ex - 5, ey - 2, 10, 4, RAMP.green[2]); rect(g, ex - 2, ey - 1, 4, 2, '#ffffff'); px(g, ex + dir, ey, INK);
  rect(g, x + dir * 14 - 3, y - 12 + bob, 6, 2, RAMP.gold[3]); drawStar(g, x + dir * 15, y - 8 + bob, 2.5, RAMP.gold[4]);
}

function torreGlories(g, x, base, t) {

defMG({

  song: () => ({ spb: 4, tracks: [

    { i: 'd', v: .7, n: 'k . h h s . h h k . h h s . h s k . h h s . h h k . h h s s s s' }] }),
  init(g) {
    const n = [2, 3, 4][g.level - 1];
    g.fleas = [];
    for (let i = 0; i < n; i++) g.fleas.push(this.spot(g, { dead: false, jump: 0, sit: g.r(.1, .5), f: 0 }));
    g.face = 'grr'; g.bounce = 0;

  spot(g, fl0) { const x = g.r(40, 188), y = 196 - 92 * Math.sqrt(Math.max(0, 1 - ((x - 118) / 150) ** 2)) + g.r(10, 50); fl0.x = x; fl0.y = y; return fl0; },
  update(g, dt) {
    const sp = [1, 1.25, 1.55][g.level - 1] * g.tempo;
    g.bounce = Math.max(0, g.bounce - dt * 4);
    for (const f of g.fleas) {
      if (f.dead) { f.dt = (f.dt || 0) + dt; continue; }
      if (f.jump > 0) {
        f.jump += dt * 3.4 * sp; const k = Math.min(1, f.jump);
        f.x = lerp(f.x0, f.x1, k); f.y = lerp(f.y0, f.y1, k) - Math.sin(k * Math.PI) * f.h;
        if (k >= 1) { f.jump = 0; f.sit = g.r(.25, .7) / sp; g.fx.add({ k: 'puff', x: f.x, y: f.y + 3, r: 2, life: .25, c: '#ffffff' }); }
      } else {
        f.sit -= dt;
        if (f.sit <= 0 && g.state === 'play') { f.x0 = f.x; f.y0 = f.y; this.spot(g, f); f.x1 = f.x; f.y1 = f.y; f.x = f.x0; f.y = f.y0; f.h = g.r(18, 44); f.jump = .001; sfx('boing', { pitch: 2.4, vol: .25 }); }

      if (best) {

        g.fx.burst(best.x, best.y, 8, { k: 'star', c: [C.yellow, '#fff'], sp0: 40, sp1: 90, life0: .25, life1: .45 });
        g.fx.add({ k: 'txt', s: '¡PAF!', x: best.x, y: best.y - 10, life: .5, c: '#ffffff' });
        g.bounce = 1; g.shake(1.5, .1);

      } else { g.fx.add({ k: 'ring', x: IN.x, y: IN.y, r: 3, life: .25, c: '#ffffff' }); }

  },
  draw(g, c) {

    for (const f of g.fleas) {

// ?test=mg — every microgame × level × runs, played by its bot, synchronously.
// Writes a JSON report into <html data-result> (read with --dump-dom).
function runMgTests() {
  const only = QS.get('only'), runs = +(QS.get('runs') || 6), out = {};
  const ids = MG_ORDER.filter(id => MG[id].stage !== 'test' && (!only || only.split(',').includes(id) || only.split(',').includes(MG[id].stage)));
  BOTIN.on = true;
  for (const id of ids) {
    const def = MG[id]; out[id] = {};
    for (let lv = 1; lv <= 3; lv++) {
      let wins = 0, errs = 0, avgT = 0;
      for (let r = 0; r < runs; r++) {
        RNG = mulberry32(1000 + r * 7 + lv);
        try {
          const bpm = 120 * (1 + .13 * (r % 3));
          const g = mgNew(id, lv, bpm); IN.down = false; BOTIN.down = false;
          const maxT = def.boss ? 60 : def.beats * g.spb;
          while (g.t < maxT && !(def.boss && g.state !== 'play')) {
            const o = def.bot ? def.bot(g) || {} : {};
            BOTIN.x = o.x != null ? o.x : BOTIN.x; BOTIN.y = o.y != null ? o.y : BOTIN.y; BOTIN.down = !!o.down;
            pollInput(); botInput(); if (HITSTOP > 0) HITSTOP = 0;
            mgUpdate(g, STEP);
            if (fl(g.t * 60) % 30 === 0) mgDraw(g);
          }
          if (g.state === 'play') { if (def.survive) g.state = 'won'; else g.state = 'lost'; }
          if (g.state === 'won') wins++;
          avgT += g.decidedAt >= 0 ? g.decidedAt : g.t;
        } catch (e) { errs++; out[id].err = String(e && e.message || e); }
      }
      out[id]['L' + lv] = wins + '/' + runs + (errs ? ' E' + errs : '') + ' t' + (avgT / runs).toFixed(1);
    }
  }
  document.documentElement.setAttribute('data-result', JSON.stringify(out));
}

// ?test=audio — every instrument, sfx and song is parsed and scheduled for real
function runAudioTest() {
  const rep = { errors: [], warnings: [], songs: 0, sfx: 0, inst: 0 };
  try { auUnlock(); } catch (e) { rep.errors.push('unlock: ' + e.message); }
  if (!AU.ctx) { rep.errors.push('sin AudioContext'); document.documentElement.setAttribute('data-result', JSON.stringify(rep)); return; }
  const t0 = auT() + .05;
  for (const k in INST) { try { INST[k](440, t0, .1, .5, AU.fx); rep.inst++; } catch (e) { rep.errors.push('inst ' + k + ': ' + e.message); } }
  for (const k in SFX) { try { sfx(k, { n: 2 }); rep.sfx++; } catch (e) { rep.errors.push('sfx ' + k + ': ' + e.message); } }
  for (const who in VOICES) { try { voiceBlip(who); } catch (e) { rep.errors.push('voz ' + who + ': ' + e.message); } }
  const check = (name, song, beats) => {
    if (!song || !song.tracks) { rep.errors.push(name + ': sin pistas'); return; }
    for (const tr of song.tracks) {
      if (tr.i && tr.i !== 'd' && !INST[tr.i]) rep.errors.push(name + ': instrumento desconocido ' + tr.i);
      for (const tk of tr.n.trim().split(/\s+/)) { const t = tk.replace(/[!_]$/, ''); if (t === '.' || t === '-') continue; for (const p of t.split('+')) if (!(p.length === 1 && DRUMS.includes(p)) && noteMidi(p) == null) rep.errors.push(name + ': nota rara «' + p + '»'); }
      const steps = tr.n.trim().split(/\s+/).length, spb = song.spb || 4;
      if (beats && steps !== beats * spb && (beats * spb) % steps !== 0) rep.warnings.push(name + ': pista de ' + steps + ' pasos para ' + beats + ' pulsos');
    }
    try { const pl = playSong(song, { bpm: 120, vol: .01 }); stopSong(pl, .01); rep.songs++; } catch (e) { rep.errors.push(name + ': ' + e.message); }
  };
  for (const k in JINGLE) check('JINGLE.' + k, JINGLE[k]);
  for (const id of STAGE_ORDER) { const d = STAGES[id]; if (d.songs) for (const k in d.songs) check(id + '.' + k, d.songs[k], ['win', 'lose', 'next', 'ready'].includes(k) ? 2 : 0); }
  for (const id of MG_ORDER) { const d = MG[id]; if (d.song) { try { const g = mgNew(id, 1, 120); check('mg.' + id, d.song(g), d.boss ? 0 : d.beats); } catch (e) { rep.errors.push('mg.' + id + ': ' + e.message); } } }

  stopAllMusic(.01);
  document.documentElement.setAttribute('data-result', JSON.stringify(rep));
}

  for (let i = 0; i < ff * 60; i++) { try { tick(STEP); } catch (e) { reportError(e); } }
  try { render(); } catch (e) { reportError(e); }
  requestAnimationFrame(frame);
}
// the bot plays whatever microgame is running (tests + captures)
function botDrive() {
  let g = null;
  if ((SCENE === STG || (SCENE && SCENE.wrapsStage)) && STG.S && STG.S.phase === 'play') g = STG.S.g;
  if (SCENE === CUT && CUT.mg) g = CUT.mg;
  if (typeof MGT !== 'undefined' && SCENE === MGT) g = MGT.g;
  if (g && g.def.bot) { const o = g.def.bot(g) || {}; BOTIN.x = o.x != null ? o.x : BOTIN.x; BOTIN.y = o.y != null ? o.y : BOTIN.y; BOTIN.down = !!o.down; }
  else BOTIN.down = false;
}
boot();
